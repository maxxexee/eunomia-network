name: Feature request
description: Propose a change to Eunomia Network.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else did you consider?

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Landing page
        - Onboarding and sign-in
        - Wallet provisioning
        - ENS registration
        - Faucet claim
        - Hunter workspace
        - DAO workspace
        - Dispute workspace
        - Registry backend
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request does not include secrets or customer data.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
